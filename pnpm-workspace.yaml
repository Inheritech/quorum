packages:
  - .
storeDir: .pnpm-store
cacheDir: .pnpm-cache
stateDir: .pnpm-state
managePackageManagerVersions: false
verifyDepsBeforeRun: false
# Keep local resolution and CI installs on the same 24-hour publication delay.
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: false
